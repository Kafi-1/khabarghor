  <style id="kg-splash-css">
    html.kg-splashing{overflow:hidden}
    #kg-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 38%,#f58a3c 0,#E85D04 52%,#b94503 100%);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;transition:opacity .4s ease,visibility .4s}
    #kg-splash.kg-out{opacity:0;visibility:hidden}
    #kg-splash .kg-s-logo{width:104px;height:104px;filter:drop-shadow(0 14px 26px rgba(0,0,0,.28));animation:kgPop .75s cubic-bezier(.2,1.5,.4,1) both,kgBob 2.4s ease-in-out .75s infinite}
    #kg-splash .kg-steam path{fill:none;stroke:#E85D04;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:14;stroke-dashoffset:14;animation:kgSteam 1.7s ease-in-out infinite}
    #kg-splash .kg-steam path:nth-child(2){animation-delay:.25s}
    #kg-splash .kg-steam path:nth-child(3){animation-delay:.5s}
    #kg-splash h1{margin:14px 0 0;font-size:1.9rem;font-weight:800;letter-spacing:-.04em;animation:kgUp .6s ease .3s both}
    #kg-splash p{margin:0;font-size:.9rem;opacity:.85;animation:kgUp .6s ease .45s both}
    #kg-splash .kg-dots{display:flex;gap:7px;margin-top:22px;animation:kgUp .6s ease .6s both}
    #kg-splash .kg-dots i{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.5;animation:kgDot 1s ease-in-out infinite}
    #kg-splash .kg-dots i:nth-child(2){animation-delay:.15s}
    #kg-splash .kg-dots i:nth-child(3){animation-delay:.3s}
    @keyframes kgPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes kgBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes kgSteam{0%{stroke-dashoffset:14;opacity:0}40%{opacity:1}100%{stroke-dashoffset:-14;opacity:0}}
    @keyframes kgUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes kgDot{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-7px);opacity:1}}
  </style>
  <link rel="manifest" href="manifest.json">

<body>
  <!-- App-open loading screen (shown once per app launch) -->
  <div id="kg-splash" role="status" aria-label="Loading Khabar Ghor">
    <svg class="kg-s-logo" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="16" fill="#fff"/>
      <path d="M18 29h28c0 9-6.3 15-14 15s-14-6-14-15Z" fill="#E85D04"/>
      <path d="M22 48h20" stroke="#E85D04" stroke-width="3" stroke-linecap="round"/>
      <g class="kg-steam"><path d="M25 19c-3-3 2-4 0-7"/><path d="M32 19c-3-3 2-4 0-7"/><path d="M39 19c-3-3 2-4 0-7"/></g>
    </svg>
    <h1>Khabar Ghor</h1>
    <p>Local Khabar, Apnar Kache</p>
    <div class="kg-dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('kg-splash');
      try { if (sessionStorage.getItem('kg_splash')) { el.parentNode.removeChild(el); window.kgHideSplash = function () {}; return; } } catch (e) {}
      document.documentElement.classList.add('kg-splashing');
      var t0 = Date.now(), done = false;
      window.kgHideSplash = function () {
        if (done) return; done = true;
        setTimeout(function () {
          el.className += ' kg-out';
          try { sessionStorage.setItem('kg_splash', '1'); } catch (e) {}
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); document.documentElement.classList.remove('kg-splashing'); }, 450);
        }, Math.max(0, 900 - (Date.now() - t0)));
      };
      setTimeout(window.kgHideSplash, 3500); // never stay stuck
    })();
  </script>
  <div class="app-container" id="app">
    <!-- Splash / Landing (shown first time or when not navigating) -->
    <div id="splash-view" class="splash-page" style="display:none;">
      <div class="splash-logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#E85D04"/><path d="M20 12c-2 3 2 5 0 8M32 10c-2 3 2 5 0 8M44 12c-2 3 2 5 0 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/><path d="M12 32h40c0 11-8 19-20 19S12 43 12 32z" fill="#fff"/><rect x="22" y="53" width="20" height="3" rx="1.5" fill="#fff"/></svg>
      </div>
      <h1 class="splash-title">Khabar Ghor</h1>
      <p class="splash-subtitle">Local Khabar, Apnar Kache<br>Ghorer Moto Shad</p>
      <button class="splash-btn" id="start-btn">Shuru Korun →</button>
    </div>

    <!-- Main Home View -->
    <div id="home-view">
      <div class="home-header">
        <div class="location-row">
          <div class="location-info"><span class="brand-logo"><svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#E85D04"/><path d="M20 12c-2 3 2 5 0 8M32 10c-2 3 2 5 0 8M44 12c-2 3 2 5 0 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/><path d="M12 32h40c0 11-8 19-20 19S12 43 12 32z" fill="#fff"/><rect x="22" y="53" width="20" height="3" rx="1.5" fill="#fff"/></svg></span><div><strong class="brand-name">Khabar Ghor</strong><br><span style="font-size:0.75rem;color:var(--text-muted);">Local Khabar, Apnar Kache</span></div></div>
          <div class="header-actions">
            <a href="cart.html" class="notif-btn cart-header-btn" aria-label="Cart" id="home-cart-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
              </svg>
              <span class="cart-badge" style="display:none;">0</span>
            </a>
            <button class="notif-btn" aria-label="Notifications">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 01-3.46 0"/>
              </svg>
              <span class="notif-dot"></span>
            </button>
          </div>
        </div>
        <div class="search-bar" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="search" id="home-search" placeholder="Search food or restaurant..." aria-label="Search">

      </div>

      <div class="page-content">

        <div id="home-slider" class="kg-slider" style="display:none" aria-label="Offers"></div>
        <!-- Categories -->
        <div class="categories-section">
          <div class="categories-scroll" id="categories-list">
            <!-- Loaded dynamically -->

        </div>

        <!-- Products from admin panel (Firebase) -->
        <section class="section" id="menu">
          <div class="section-header">
            <h2 id="menu-title">Our Menu</h2>
            <a href="restaurants.html">Restaurants →</a>

          <div class="product-grid" id="products-grid"></div>
        </section>
      </div>

      <!-- Bottom Nav -->
      <div id="bottom-nav"></div>

      <!-- WhatsApp Support floating button -->
      <a href="#" target="_blank" rel="noopener" class="wa-float" id="wa-support" aria-label="WhatsApp Support" style="display:none">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      </a>
    </div>
