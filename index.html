<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Khabar Ghor - Local Khabar, Apnar Kache, Ghorer Moto Shad. Order your favourite food now!">
  <meta name="theme-color" content="#E85D04">
  <meta property="og:title" content="Khabar Ghor - Local Food, Closer To You">
  <meta property="og:description" content="Order your favourite local food quickly and easily.">
  <meta property="og:type" content="website">
  <title>Khabar Ghor - Local Khabar, Apnar Kache</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-container" id="app">
    <!-- Splash / Landing (shown first time or when not navigating) -->
    <div id="splash-view" class="splash-page" style="display:none;">
      <div class="splash-logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#E85D04"/><path d="M20 12c-2 3 2 5 0 8M32 10c-2 3 2 5 0 8M44 12c-2 3 2 5 0 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/><path d="M12 32h40c0 11-8 19-20 19S12 43 12 32z" fill="#fff"/><rect x="22" y="53" width="20" height="3" rx="1.5" fill="#fff"/></svg>
      </div>
      <h1 class="splash-title">Khabar Ghor</h1>
      <p class="splash-subtitle">Local Khabar, Apnar Kache<br>Ghorer Moto Shad</p>
      <button class="splash-btn" id="start-btn">Shuru Korun →</button>
    </div>

    <!-- Main Home View -->
    <div id="home-view">
      <div class="home-header">
        <div class="location-row">
          <div class="location-info"><span class="brand-logo"><svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#E85D04"/><path d="M20 12c-2 3 2 5 0 8M32 10c-2 3 2 5 0 8M44 12c-2 3 2 5 0 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/><path d="M12 32h40c0 11-8 19-20 19S12 43 12 32z" fill="#fff"/><rect x="22" y="53" width="20" height="3" rx="1.5" fill="#fff"/></svg></span><div><strong class="brand-name">Khabar Ghor</strong><br><span style="font-size:0.75rem;color:var(--text-muted);">Local Khabar, Apnar Kache</span></div></div>
          <div class="header-actions">
            <a href="cart.html" class="notif-btn cart-header-btn" aria-label="Cart" id="home-cart-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
              </svg>
              <span class="cart-badge" style="display:none;">0</span>
            </a>
            <button class="notif-btn" aria-label="Notifications">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 01-3.46 0"/>
              </svg>
              <span class="notif-dot"></span>
            </button>
          </div>
        </div>
        <div class="search-bar" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="search" id="home-search" placeholder="Search food or restaurant..." aria-label="Search">
        </div>
      </div>

      <div class="page-content">
        <!-- Banner loaded from Firebase promos (hidden if empty) -->
        <div id="home-banner" style="display:none;"></div>
        <!-- Categories -->
        <div class="categories-section">
          <div class="categories-scroll" id="categories-list">
            <!-- Loaded dynamically -->
          </div>
        </div>

        <!-- Products from admin panel (Firebase) -->
        <section class="section" id="menu">
          <div class="section-header">
            <h2 id="menu-title">Our Menu</h2>
            <a href="restaurants.html">Restaurants →</a>
          </div>
          <div class="product-grid" id="products-grid"></div>
        </section>
      </div>

      <!-- Bottom Nav -->
      <div id="bottom-nav"></div>

      <!-- WhatsApp Support floating button -->
      <a href="https://wa.me/8801700000000" target="_blank" rel="noopener" class="wa-float" id="wa-support" aria-label="WhatsApp Support">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      </a>
    </div>
  </div>

  <script type="module" src="js/home.js"></script>
</body>
</html>
