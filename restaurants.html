<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Explore the best restaurants near you - Khabar Ghor">
  <meta name="theme-color" content="#E85D04">
  <title>Restaurants - Khabar Ghor</title>
  <link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <button class="header-btn back-btn" onclick="history.back()" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h1 class="header-title">Restaurants</h1>
      </div>
      <div class="header-right">
        <a href="cart.html" class="header-btn cart-btn" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span class="cart-badge" style="display:none">0</span>
        </a>
      </div>
    </header>

    <div class="home-header" style="padding-top:0;border-bottom:1px solid var(--border-light);">
      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="search-input" placeholder="Search restaurant or food..." aria-label="Search restaurants">
      </div>
    </div>

    <div class="filter-tabs" id="filter-tabs">
      <button class="filter-tab active" data-filter="nearby">Nearest</button>
      <button class="filter-tab" data-filter="rating">Rating</button>
      <button class="filter-tab" data-filter="promo">Promo</button>
      <button class="filter-tab" data-filter="popular">Best Seller</button>
    </div>

    <div class="page-content">
      <div class="restaurant-list" id="restaurant-list">
        <!-- Loaded dynamically -->
      </div>
    </div>

    <div id="bottom-nav"></div>
  </div>

  <script type="module" src="js/restaurants.js"></script>
</body>
</html>
