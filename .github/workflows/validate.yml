name: Validate frontend JavaScript

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript module syntax
        run: |
          set -e
          for file in js/*.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
