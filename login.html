<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E85D04">
  <title>Login - Khabar Ghor</title>
  <link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-container">
    <div class="auth-page">
      <div class="auth-header">
        <div class="splash-logo">
          <svg viewBox="0 0 64 64" fill="none" width="40" height="40">
            <circle cx="32" cy="32" r="30" stroke="#E85D04" stroke-width="3"/>
            <path d="M22 28c0-4 3-8 10-8s10 4 10 8v4c0 2-1 3-2 3h-2v8c0 1-1 2-2 2h-8c-1 0-2-1-2-2v-8h-2c-1 0-2-1-2-3v-4z" fill="#E85D04"/>
          </svg>
        </div>
        <h1>Khabar Ghor</h1>
        <p>Login to order your favourite food</p>
      </div>

      <div class="auth-form">
        <div id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="nama@email.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Minimal 6 karakter" required autocomplete="current-password">
          </div>
          <button class="btn btn-primary btn-block" id="login-submit">Login</button>
        </div>

        <div id="register-form" style="display:none;">
          <div class="form-group">
            <label for="reg-name">Nama</label>
            <input type="text" id="reg-name" placeholder="Nama lengkap" required>
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="nama@email.com" required>
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" placeholder="Minimal 6 karakter" required>
          </div>
          <button class="btn btn-primary btn-block" id="register-submit">Sign Up</button>
        </div>

        <div class="auth-divider">atau</div>

        <button class="btn btn-outline btn-block" id="google-login">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>

        <div class="auth-switch">
          <span id="switch-text">Don't have an account?</span>
          <a href="#" id="switch-link">Sign Up</a>
        </div>

        <div style="text-align:center;margin-top:24px;">
          <a href="index.html" style="color:var(--text-muted);font-size:0.85rem;">← Back ke Home</a>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
