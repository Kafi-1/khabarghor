<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E85D04">
  <title>Restaurants - Khabar Ghor</title>
  <link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-container">
    <div id="restaurant-content">
      <!-- Loaded dynamically -->
      <div class="loading-container" style="min-height:60vh;">
        <div class="spinner"></div>
        <p>Loading menu...</p>
      </div>
    </div>

    <!-- Floating cart bar -->
    <a href="cart.html" class="floating-cart hidden" id="floating-cart">
      <div class="floating-cart-info">
        <span class="floating-cart-count" id="float-count">0</span>
        <span>Lihat Cart</span>
      </div>
      <span class="floating-cart-total" id="float-total">৳0</span>
    </a>
  </div>

  <script type="module" src="js/restaurant.js"></script>
</body>
</html>
