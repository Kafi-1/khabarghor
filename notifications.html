<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E85D04">
  <title>Notifications - Khabar Ghor</title>

  <link rel="stylesheet" href="css/style.css">

    <div class="page-content" id="notif-list">
      <div class="loading-container" style="min-height:40vh"><div class="spinner"></div></div>
