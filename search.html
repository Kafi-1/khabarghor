<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E85D04">
  <title>Search - Khabar Ghor</title>
  <link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header search-header">
      <div class="header-left" style="flex:1;gap:8px;">
        <button class="header-btn back-btn" onclick="history.back()" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="search-bar" style="flex:1;margin:0;" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="search" id="search-input" placeholder="Search food or restaurant..." aria-label="Search" autofocus>
        </div>
      </div>
    </header>

    <div class="page-content no-nav" id="search-results">
      <div class="empty-state" style="padding-top:48px;">
        <div class="empty-icon">🔍</div>
        <p>Type to search food or restaurants</p>
      </div>
    </div>
  </div>

  <script type="module" src="js/search.js"></script>
</body>
</html>
