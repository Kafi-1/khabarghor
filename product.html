<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E85D04">
  <title>Product - Khabar Ghor</title>
  <link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Khabar Ghor">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://i.ibb.co" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js">
  <link rel="modulepreload" href="js/firestore.js">
  <link rel="modulepreload" href="js/utils.js">
  <link rel="modulepreload" href="js/cart.js">
  <link rel="modulepreload" href="js/firebase-config.js">
  <link rel="modulepreload" href="js/ui.js">
</head>
<body>
  <div class="app-container">
    <div id="product-content">
      <div class="loading-container" style="min-height:60vh;">
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>
    </div>

    <!-- Sticky bottom action bar -->
    <div class="product-action-bar hidden" id="product-action-bar">
      <div class="product-qty-wrap">
        <button class="qty-btn" id="pd-minus" aria-label="Decrease">−</button>
        <span class="qty-value" id="pd-qty">1</span>
        <button class="qty-btn" id="pd-plus" aria-label="Increase">+</button>
      </div>
      <button class="btn btn-primary product-add-btn" id="pd-add">Add to Cart</button>
      <button class="btn btn-outline product-buy-btn" id="pd-buy">Buy Now</button>
    </div>
  </div>

  <script type="module" src="js/product.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
